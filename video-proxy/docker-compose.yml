version: '3'

services:
  # Postgres database for Invidious
  invidious-db:
    image: postgres:15
    environment:
      POSTGRES_DB: invidious
      POSTGRES_USER: kemal
      POSTGRES_PASSWORD: password
    volumes:
      - invidious_db:/var/lib/postgresql/data

  # Invidious service built from a custom Dockerfile
  invidious:
    build: .  # Tells Docker Compose to build the Invidious image from the Dockerfile in the current directory
    ports:
      - "3000:3000"  # Exposes Invidious on port 3000
    depends_on:
      - invidious-db  # Ensures the database is up before Invidious starts
    environment:
      INVIDIOUS_CONFIG: |
        db:
          dbname: invidious
          user: kemal
          password: password
          host: invidious-db  # Name of the Postgres container
        check_tables: true  # Ensures the necessary database tables are created at startup
        default_frontend: YouTube  # Set the default frontend to YouTube
        domain: localhost  # Adjust this if you're using a custom domain

# Named volume for persistent Postgres data
volumes:
  invidious_db:
